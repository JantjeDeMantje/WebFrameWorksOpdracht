
<table class="table table-striped table bordered">
    <thead>
        <tr>
            <th>id</th>
            <th>name</th>
            <th>email</th>
        </tr>
    </thead>


<tbody>
    <tr *ngFor="let user of users">
        <td>{{user.id}}</td>
        <td><a [routerLink]="['/user', user.id]">{{user.firstName}}{{user.lastName}}</a></td>
        <td>{{user.emailAdress}}</td>
    </tr>
</tbody>
</table>
